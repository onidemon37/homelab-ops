name: Flux Local

on:
  pull_request:
    branches: [main]
    paths:
      - apps/**
      - clusters/**
      - ci/flux-local-stub/**
      - infrastructure/kubernetes/**
      - .github/workflows/flux-local.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flux-local:
    name: Flux manifest test (${{ matrix.cluster }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cluster: [prod, non-prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test Flux manifests when bootstrapped
        shell: bash
        run: |
          path="clusters/${{ matrix.cluster }}"
          test -f "$path/kustomization.yaml" || {
            echo "::error::Missing cluster kustomization: $path/kustomization.yaml"
            exit 1
          }

          test -f ci/flux-local-stub/gitrepository.yaml || {
            echo "::error::Missing flux-local GitRepository stub"
            exit 1
          }

          stub="$path/flux-system/gitrepository-ci.yaml"
          apps_manifest="$path/apps.yaml"
          apps_backup="$apps_manifest.flux-local-backup"
          cp "$apps_manifest" "$apps_backup"
          trap 'mv "$apps_backup" "$apps_manifest"; rm -f "$stub"' EXIT

          sed -i 's#path: ./apps/overlays/#path: ../../apps/overlays/#' "$apps_manifest"
          cp ci/flux-local-stub/gitrepository.yaml \
            "$stub"

          echo "Debug workspace"
          pwd
          ls -la
          ls -la clusters/ || echo "clusters/ not found at $(pwd)"
          ls -la "$path" || echo "$path not found"

          docker run --rm \
            -v "$PWD:/workspace" \
            ghcr.io/allenporter/flux-local:v8.1.0 \
            test --enable-helm --all-namespaces --path "/workspace/$path" -v
