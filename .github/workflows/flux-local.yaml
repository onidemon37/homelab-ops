name: Flux Local

on:
  pull_request:
    branches: [main]
    paths:
      - apps/**
      - clusters/**
      - ci/flux-local-stub/**
      - infrastructure/kubernetes/**
      - .github/workflows/flux-local.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flux-local:
    name: Flux manifest test (${{ matrix.cluster }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cluster: [prod, non-prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test Flux manifests when bootstrapped
        shell: bash
        run: |
          path="clusters/${{ matrix.cluster }}"
          test -f "$path/kustomization.yaml" || {
            echo "::error::Missing cluster kustomization: $path/kustomization.yaml"
            exit 1
          }

          test -f ci/flux-local-stub/gitrepository.yaml || {
            echo "::error::Missing flux-local GitRepository stub"
            exit 1
          }

          scratch="${RUNNER_TEMP}/flux-local-check"
          rm -rf "$scratch"
          mkdir -p "$scratch/clusters"
          cp -R "$path" "$scratch/clusters/"
          cp ci/flux-local-stub/gitrepository.yaml \
            "$scratch/$path/flux-system/gitrepository-ci.yaml"

          docker run --rm \
            -v "$scratch:/workspace" \
            ghcr.io/allenporter/flux-local:v8.1.0 \
            test --enable-helm --all-namespaces --path "/workspace/$path" -v
