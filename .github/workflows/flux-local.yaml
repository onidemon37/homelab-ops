name: Flux Local

on:
  pull_request:
    branches: [main]
    paths:
      - apps/**
      - clusters/**
      - .github/workflows/flux-local.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flux-local:
    name: Flux manifest test (${{ matrix.cluster }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cluster: [prod, non-prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: 5.7.1
      - name: Install yq
        shell: bash
        run: |
          sudo curl --fail --silent --show-error --location \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 \
            --output /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: Render cluster and application manifests
        shell: bash
        run: |
          cluster_path="clusters/${{ matrix.cluster }}"
          app_path="apps/overlays/${{ matrix.cluster }}"
          foundation_path="apps/overlays/${{ matrix.cluster }}/foundation"
          secrets_path="apps/overlays/${{ matrix.cluster }}/secrets"
          test -f "$cluster_path/kustomization.yaml"
          test -f "$app_path/kustomization.yaml"
          test -f "$foundation_path/kustomization.yaml"
          test -f "$secrets_path/kustomization.yaml"
          kustomize build "$cluster_path" >/tmp/cluster.yaml
          kustomize build "$app_path" >/tmp/apps.yaml
          kustomize build "$foundation_path" >/tmp/foundation.yaml
          kustomize build "$secrets_path" >/tmp/secrets.yaml
          test -s /tmp/cluster.yaml
          test -s /tmp/apps.yaml
          test -s /tmp/foundation.yaml
          test -s /tmp/secrets.yaml

          # Controllers reconcile across three Flux Kustomizations. Check the
          # union so their required HelmReleases cannot silently disappear.
          cat /tmp/foundation.yaml /tmp/secrets.yaml /tmp/apps.yaml >/tmp/all.yaml

          helmrelease_count=$(grep -c '^kind: HelmRelease$' /tmp/all.yaml || true)
          if [ "$helmrelease_count" -eq 0 ]; then
            echo "::error::No HelmRelease resources rendered for $app_path/$foundation_path/$secrets_path"
            exit 1
          fi

          for release in cert-manager metrics-server reloader external-secrets envoy-gateway; do
            found=$(yq eval-all \
              "select(.kind == \"HelmRelease\" and .metadata.name == \"$release\") | .metadata.name" \
              /tmp/all.yaml)
            if [ -z "$found" ]; then
              echo "::error::Missing HelmRelease: $release"
              exit 1
            fi
          done
