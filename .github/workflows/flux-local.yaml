name: Flux Local

on:
  pull_request:
    branches: [main]
    paths:
      - apps/**
      - clusters/**
      - .github/workflows/flux-local.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flux-local:
    name: Flux manifest test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: atlantis
            cluster_path: clusters/prod/atlantis
            overlay_paths: |
              apps/overlays/prod/atlantis/infrastructure
              apps/overlays/prod/atlantis/networking
              apps/overlays/prod/atlantis/observability
              apps/overlays/prod/atlantis/shared-services
          - name: galactica
            cluster_path: clusters/prod/galactica
            overlay_paths: |
              apps/overlays/prod/galactica/infrastructure
              apps/overlays/prod/galactica/networking
              apps/overlays/prod/galactica/observability
          - name: pegasus
            cluster_path: clusters/non-prod
            overlay_paths: |
              apps/overlays/non-prod/pegasus/infrastructure/controllers
              apps/overlays/non-prod/pegasus/infrastructure/services
              apps/overlays/non-prod/pegasus/networking
              apps/overlays/non-prod/pegasus/observability
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: 5.7.1
      - name: Install yq
        shell: bash
        run: |
          sudo curl --fail --silent --show-error --location \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 \
            --output /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: Render cluster and application manifests
        shell: bash
        run: |
          cluster_path="${{ matrix.cluster_path }}"
          test -f "$cluster_path/kustomization.yaml"
          kustomize build "$cluster_path" >/tmp/cluster.yaml
          test -s /tmp/cluster.yaml
          while IFS= read -r path; do
            test -n "$path" || continue
            test -f "$path/kustomization.yaml"
            kustomize build "$path" >"/tmp/$(basename "$path").yaml"
          done <<< "${{ matrix.overlay_paths }}"
