name: Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Determine next tag
        id: next-tag
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1,
            });
            const previous = releases[0]?.tag_name ?? "0.0.0";
            const [major, minor, patch] = previous.split(".").map(Number);
            const now = new Date();
            const version = `${now.getUTCFullYear()}.${now.getUTCMonth() + 1}`;
            return `${version}.${version === `${major}.${minor}` ? patch + 1 : 0}`;
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          tag: ${{ steps.next-tag.outputs.result }}
