name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yaml:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install yamllint
        run: python -m pip install yamllint
      - name: Lint YAML
        run: |
          mapfile -d '' files < <(
            find . -type f \( -name '*.yaml' -o -name '*.yml' \) \
              -not -path './.git/*' \
              -not -path '*/.terraform/*' -print0
          )
          if [ "${#files[@]}" -gt 0 ]; then
            yamllint -d relaxed --no-warnings "${files[@]}"
          fi

  kustomize:
    name: Kustomize ${{ matrix.cluster }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cluster: atlantis
            paths: |
              clusters/prod/atlantis
              apps/overlays/prod/atlantis/infrastructure
              apps/overlays/prod/atlantis/networking
              apps/overlays/prod/atlantis/observability
              apps/overlays/prod/atlantis/shared-services
          - cluster: galactica
            paths: |
              clusters/prod/galactica
              apps/overlays/prod/galactica/infrastructure
              apps/overlays/prod/galactica/networking
              apps/overlays/prod/galactica/observability
          - cluster: pegasus
            paths: |
              clusters/non-prod
              apps/overlays/non-prod/pegasus/infrastructure/controllers
              apps/overlays/non-prod/pegasus/infrastructure/services
              apps/overlays/non-prod/pegasus/networking
              apps/overlays/non-prod/pegasus/observability
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: 5.7.1
      - name: Build Flux application waves
        shell: bash
        run: |
          while IFS= read -r path; do
            test -n "$path" || continue
            kustomize build "$path"
          done <<< "${{ matrix.paths }}"

  ansible:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ansible-lint
        run: python -m pip install ansible-core ansible-lint
      - name: Lint Ansible when present
        shell: bash
        run: |
          if find infrastructure/ansible -type f \( -name '*.yml' -o -name '*.yaml' \) -print -quit 2>/dev/null | grep -q .; then
            ansible-lint infrastructure/ansible
          else
            echo "No Ansible files yet; skipping until the Debian bootstrap phase."
          fi
