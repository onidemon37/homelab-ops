name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yaml:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install yamllint
        run: python -m pip install yamllint
      - name: Lint YAML
        run: |
          mapfile -d '' files < <(
            find . -type f \( -name '*.yaml' -o -name '*.yml' \) \
              -not -path './.git/*' \
              -not -path '*/.terraform/*' -print0
          )
          if [ "${#files[@]}" -gt 0 ]; then
            yamllint -d relaxed --no-warnings "${files[@]}"
          fi

  kustomize:
    name: Kustomize ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [prod, non-prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: 5.7.1
      - name: Build Flux application waves
        shell: bash
        run: |
          paths=(
            "apps/overlays/${{ matrix.environment }}"
            "apps/overlays/${{ matrix.environment }}/foundation"
            "apps/overlays/${{ matrix.environment }}/foundation/cert-manager"
            "apps/overlays/${{ matrix.environment }}/foundation/cert-manager-config"
            "apps/overlays/${{ matrix.environment }}/secrets"
            "apps/overlays/${{ matrix.environment }}/cloudnative-pg"
            "clusters/${{ matrix.environment }}"
          )
          for path in "${paths[@]}"; do
            kustomize build "$path"
          done
      - name: Enforce environment domain boundaries
        shell: bash
        run: |
          if [ "${{ matrix.environment }}" = "prod" ]; then
            forbidden='ninhu\\.com'
          else
            forbidden='andorigna\\.com'
          fi
          if grep -RInE "$forbidden" "apps/overlays/${{ matrix.environment }}" 2>/dev/null; then
            echo "Found a domain belonging to another tenant/environment."
            exit 1
          fi

  ansible:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ansible-lint
        run: python -m pip install ansible-core ansible-lint
      - name: Lint Ansible when present
        shell: bash
        run: |
          if find infrastructure/ansible -type f \( -name '*.yml' -o -name '*.yaml' \) -print -quit 2>/dev/null | grep -q .; then
            ansible-lint infrastructure/ansible
          else
            echo "No Ansible files yet; skipping until the Debian bootstrap phase."
          fi
