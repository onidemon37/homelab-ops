version: '3'

includes:
  flux: taskfiles/flux.yaml
  lint: taskfiles/lint.yaml
  validation: taskfiles/validation.yaml

tasks:
  default:
    cmds:
      - task --list

  validate:
    desc: "Render every cluster with kustomize (Makefile: make validate)"
    cmds:
      - task: validation:all

  lint:
    desc: "Lint YAML, shell and Terraform (Makefile: make lint)"
    cmds:
      - task: lint:all
