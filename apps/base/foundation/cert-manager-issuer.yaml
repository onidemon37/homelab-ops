apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cert-manager-vault
  namespace: cert-manager
spec:
  provider:
    vault:
      server: https://vault-active.vault.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: vault-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: app-cert-manager
          serviceAccountRef:
            name: cert-manager
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cert-manager-vault
    kind: SecretStore
  target:
    name: cloudflare-api-token-secret
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: apps/cert-manager/cloudflare
        property: api-token
---
# Public ACME certs for andorigna.com (prod)/ninhu.xyz (non-prod) via Cloudflare
# DNS-01. Staging avoids Let's Encrypt rate limits; switch an app's
# Certificate/HTTPRoute to letsencrypt-prod once its DNS-01 flow is verified.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@andorigna.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@andorigna.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
