apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 30m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: gateway-helm
      sourceRef:
        kind: OCIRepository
        name: envoy-gateway
        namespace: flux-system
  values:
    deployment:
      replicas: 1
