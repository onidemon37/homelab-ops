apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-vault-ca
  namespace: vault
rules:
  - apiGroups: [""]
    resources:
      - secrets
    resourceNames:
      - vault-ca
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-vault-ca
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-vault-ca
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-ca-source
  namespace: observability
spec:
  provider:
    kubernetes:
      remoteNamespace: vault
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
      caProvider:
        type: ConfigMap
        name: kube-root-ca.crt
        namespace: kube-system
        key: ca.crt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-ca
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-ca-source
    kind: SecretStore
  target:
    name: vault-ca
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ca.crt
      remoteRef:
        key: vault-ca
        property: ca.crt