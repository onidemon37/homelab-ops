apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cert-manager-vault
  namespace: cert-manager
spec:
  provider:
    vault:
      server: https://vault-active.vault.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: vault-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: app-cert-manager
          serviceAccountRef:
            name: cert-manager
            namespace: cert-manager
