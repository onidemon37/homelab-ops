apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 30m
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: vault
      version: ">=0.30.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
  values:
    global:
      tlsDisable: false
    server:
      volumes:
        - name: vault-tls
          secret:
            secretName: vault-tls
      volumeMounts:
        - name: vault-tls
          mountPath: /vault/userconfig/vault-tls
          readOnly: true
      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true

            listener "tcp" {
              address = "[::]:8200"
              cluster_address = "[::]:8201"
              tls_disable = 0
              tls_cert_file = "/vault/userconfig/vault-tls/tls.crt"
              tls_key_file = "/vault/userconfig/vault-tls/tls.key"
              tls_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
              telemetry {
                unauthenticated_metrics_access = true
              }
            }

            storage "raft" {
              path = "/vault/data"
              retry_join {
                leader_api_addr = "https://vault-0.vault-internal.vault.svc.cluster.local:8200"
                leader_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
                leader_tls_servername = "vault-0.vault-internal.vault.svc.cluster.local"
              }
              retry_join {
                leader_api_addr = "https://vault-1.vault-internal.vault.svc.cluster.local:8200"
                leader_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
                leader_tls_servername = "vault-1.vault-internal.vault.svc.cluster.local"
              }
              retry_join {
                leader_api_addr = "https://vault-2.vault-internal.vault.svc.cluster.local:8200"
                leader_ca_cert_file = "/vault/userconfig/vault-tls/ca.crt"
                leader_tls_servername = "vault-2.vault-internal.vault.svc.cluster.local"
              }
            }

            service_registration "kubernetes" {}

            telemetry {
              prometheus_retention_time = "12h"
              disable_hostname = true
            }
      dataStorage:
        enabled: true
        storageClass: longhorn
        size: 5Gi
      auditStorage:
        enabled: true
        storageClass: longhorn
        size: 5Gi
        mountPath: /vault/audit
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    ui:
      enabled: true
      serviceType: ClusterIP
    injector:
      enabled: true
