apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/helmreleases
patches:
  - path: ../foundation/patches.yaml
  - path: ../networking-patches.yaml
  - path: ../storage-patches.yaml
  - path: ../secrets-patches.yaml
  - path: ../database-helmrelease-patches.yaml
  - path: ../patches.yaml
  - path: ../tempo-patches.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: tempo
      namespace: observability
