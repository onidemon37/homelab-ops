apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../base/networking
  - ../../base/storage
  - ../../base/databases
  - ../../base/secrets
  - proxmox-ve-exporter.yaml
  - dashboard-proxmox.yaml
  - raspberry-pi-node-exporter.yaml
  - dashboard-raspberry-pi.yaml
patches:
  - path: patches.yaml
  - path: networking-patches.yaml
  - path: storage-patches.yaml
  - path: database-patches.yaml
  - path: secrets-patches.yaml
  - path: tempo-patches.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: tempo
      namespace: observability
  - path: grafana-patches.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: grafana
      namespace: observability
