apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  values:
    replicaCount: 1
    tolerations: &controlPlaneTolerations
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
    webhook:
      replicaCount: 1
      tolerations: *controlPlaneTolerations
    cainjector:
      replicaCount: 1
      tolerations: *controlPlaneTolerations
    startupapicheck:
      replicaCount: 1
      tolerations: *controlPlaneTolerations
