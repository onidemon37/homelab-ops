apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  values:
    defaultSettings:
      defaultReplicaCount: 2
      defaultDataPath: /var/lib/longhorn
      # discover-proc-kubelet-cmdline is system-managed by Longhorn, so component-level tolerations do not control it.
      taintToleration: "node-role.kubernetes.io/control-plane:NoSchedule;node-role.kubernetes.io/master:NoSchedule"
    persistence:
      defaultClassReplicaCount: 2
    csi:
      kubeletRootDir: /var/lib/kubelet
    tolerations: &controlPlaneTolerations
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"

    longhornManager:
      tolerations: *controlPlaneTolerations

    longhornDriver:
      tolerations: *controlPlaneTolerations

    longhornUI:
      tolerations: *controlPlaneTolerations

    longhornAdmissionEngine:
      tolerations: *controlPlaneTolerations
