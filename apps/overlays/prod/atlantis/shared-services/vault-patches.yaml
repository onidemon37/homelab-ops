apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  values:
    server:
      tolerations: &controlPlaneTolerations
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      ha:
        enabled: true
        replicas: 3
      dataStorage:
        enabled: true
        storageClass: longhorn
        size: 5Gi
      auditStorage:
        enabled: true
        storageClass: longhorn
        size: 5Gi
        mountPath: /vault/audit
    injector:
      enabled: true
      replicas: 1
      tolerations: *controlPlaneTolerations
