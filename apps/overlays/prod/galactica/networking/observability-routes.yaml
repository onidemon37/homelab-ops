apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-internal
  namespace: networking
spec:
  parentRefs:
    - name: internal
      sectionName: http
  hostnames:
    - grafana.galactica.ninhu.xyz
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          namespace: observability
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-internal
  namespace: networking
spec:
  parentRefs:
    - name: internal
      sectionName: http
  hostnames:
    - prometheus.galactica.ninhu.xyz
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-prometheus
          namespace: observability
          port: 9090
