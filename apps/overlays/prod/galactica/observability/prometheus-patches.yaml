---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  values:
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    prometheus:
      route:
        main:
          enabled: true
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          hostnames:
            - prometheus.andorigna.com
          parentRefs:
            - name: external
              namespace: networking
              sectionName: https
          matches:
            - path:
                type: PathPrefix
                value: /
      prometheusSpec:
        replicas: 2
        enableRemoteWriteReceiver: true
        externalLabels:
          cluster: galactica
          environment: prod
        additionalScrapeConfigs:
          - job_name: proxmox-ve-exporter
            scrape_interval: 30s
            scrape_timeout: 10s
            metrics_path: /pve
            params:
              target:
                - hyperion.ninhu.xyz
            static_configs:
              - targets:
                  - hyperion.ninhu.xyz:9221
                labels:
                  instance: proxmox-ve
          - job_name: raspberry-pi-node-exporter
            scrape_interval: 30s
            scrape_timeout: 10s
            static_configs:
              - targets:
                  - rpi.ninhu.xyz:9100
                labels:
                  instance: raspberry-pi
        storageSpec:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 10Gi
    alertmanager:
      alertmanagerSpec:
        replicas: 2
