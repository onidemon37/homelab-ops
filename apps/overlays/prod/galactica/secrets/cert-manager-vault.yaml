apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cert-manager-vault
  namespace: cert-manager
spec:
  provider:
    vault:
      server: https://vault.ninhu.xyz
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: vault-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes-galactica
          role: app-galactica-cert-manager
          serviceAccountRef:
            name: cert-manager
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cert-manager-vault
    kind: SecretStore
  target:
    name: cloudflare-api-token-secret
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: apps/prod/galactica/cert-manager/cloudflare
        property: api-token
