---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  values:
    prometheus:
      prometheusSpec:
        replicas: 2
        enableRemoteWriteReceiver: true
        externalLabels:
          cluster: galactica
          environment: prod
        additionalScrapeConfigs:
          - job_name: proxmox-ve-exporter
            scrape_interval: 30s
            scrape_timeout: 10s
            static_configs:
              - targets:
                  - hyperion.ninhu.xyz:9221
                labels:
                  instance: proxmox-ve
          - job_name: raspberry-pi-node-exporter
            scrape_interval: 30s
            scrape_timeout: 10s
            static_configs:
              - targets:
                  - rpi.ninhu.xyz:9100
                labels:
                  instance: raspberry-pi
        storageSpec:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 5Gi
    alertmanager:
      alertmanagerSpec:
        replicas: 2
