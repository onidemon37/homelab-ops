apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../base/networking
  - ../../base/storage
  - ../../base/secrets/controllers
  - ../../base/secrets/resources
patches:
  - path: networking-patches.yaml
  - path: storage-patches.yaml
  - path: database-patches.yaml
  - path: secrets/patches.yaml
  - path: tempo-patches.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: tempo
      namespace: observability
  - path: kube-prometheus-stack-patches.yaml
