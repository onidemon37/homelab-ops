# CI-only source anchor for flux-local.
# Flux Operator creates this GitRepository at runtime from FluxInstance.spec.sync.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/placeholder/placeholder.git
  ref:
    branch: main
