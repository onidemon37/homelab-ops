# Root Flux Kustomization for the non-prod (pegasus) cluster's application layer.
# Later phases add infrastructure.yaml (Wave 1), networking.yaml (Wave 2),
# observability.yaml (Wave 3), and tenants.yaml (Wave 4), each with dependsOn
# pointing back at this one to enforce reconciliation order.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/overlays/non-prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
