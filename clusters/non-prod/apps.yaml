# Root Flux Kustomization for the non-prod (pegasus) application layer. It
# waits for cert-manager config, External Secrets, and CloudNativePG controller
# waves before applying custom resources that depend on their CRDs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: secrets
    - name: cert-manager-config
    - name: cloudnative-pg
  interval: 10m
  path: ./apps/overlays/non-prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
