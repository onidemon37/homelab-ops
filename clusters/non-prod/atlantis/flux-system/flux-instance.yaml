# Bootstrap note: the Flux Operator itself (CRDs + controller-manager) is installed
# once, out-of-band, before this FluxInstance can be reconciled:
#   kubectl apply -f https://github.com/controlplaneio-fluxcd/flux-operator/releases/latest/download/install.yaml
# Everything from here on (the Flux controllers themselves, and this repo's sync) is
# then managed by the operator via this CR.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "1h"
    fluxcd.controlplane.io/reconcileArtifactEvery: "10m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  distribution:
    version: "2.x"
    registry: "ghcr.io/fluxcd"
    artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: cluster.local
  sync:
    kind: GitRepository
    provider: github
    url: "https://github.com/onidemon37/homelab-ops"
    ref: "refs/heads/main"
    path: "clusters/non-prod/atlantis"
    # References the GitHub App Secret reconciled by terraform/non-prod.
    pullSecret: flux-system
