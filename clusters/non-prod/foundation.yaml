# Wave 1: foundation (namespaces, Helm repositories, cert-manager CRDs,
# metrics-server, reloader). Applied before "apps" (which depends on this) so
# CRD-backed resources elsewhere (e.g. cert-manager.io/v1 Certificates) always
# dry-run validate against CRDs that already exist on a fresh cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
  interval: 10m
  path: ./apps/overlays/non-prod/foundation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
