# Wave 1a: Infrastructure Controllers
# Deploys CRDs and operators: cert-manager, external-secrets, cnpg, longhorn,
# kube-system utilities (metrics-server, reloader).
# wait: true guarantees CRDs and Longhorn CSI driver are fully registered
# before any consuming resources (Vault PVCs, Certificates) are applied.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/overlays/non-prod/infrastructure/controllers
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# Wave 1b: Infrastructure Services
# Deploys Vault (HA Raft on Longhorn PVCs), Vault TLS (cert-manager
# Certificates), Vault CA sync (ExternalSecrets), Cloudflare API token
# (ExternalSecret), and cert-manager ClusterIssuers.
# dependsOn infrastructure-controllers to ensure Longhorn StorageClass,
# cert-manager CRDs, and external-secrets CRDs all exist first.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-services
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-controllers
  interval: 10m
  path: ./apps/overlays/non-prod/infrastructure/services
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
