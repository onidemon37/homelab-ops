# Infrastructure: cert-manager and kube-system utilities (metrics-server, reloader).
# Storage and External Secrets are intentionally disabled on pegasus for now; see
# apps/overlays/non-prod/pegasus/infrastructure/kustomization.yaml.
# wait: true guarantees CRDs are registered before any consuming resources are applied.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/overlays/non-prod/pegasus/infrastructure
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
