# Wave 3: Observability
# Deploys the LGTM stack (kube-prometheus-stack, Loki, Tempo, Alloy),
# Grafana's CNPG PostgreSQL database, dashboards, and alert rules.
# dependsOn infrastructure (Longhorn for PVCs, CNPG controller
# for the Grafana Cluster CR, Vault/ESO for Grafana database credentials).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: networking
  interval: 10m
  path: ./apps/overlays/non-prod/pegasus/observability
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
