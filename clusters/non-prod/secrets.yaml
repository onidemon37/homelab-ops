# Wave 2: External Secrets Operator. wait: true prevents apps from dry-run
# validating ESO custom resources before the ESO CRDs are registered.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: foundation
  interval: 10m
  path: ./apps/overlays/non-prod/secrets
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
