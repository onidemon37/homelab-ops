# Root Flux Kustomization for the prod (galactica) cluster's application layer.
# Later phases add infrastructure.yaml (Wave 1), networking.yaml (Wave 2), and
# observability.yaml (Wave 3), each with dependsOn pointing back at this one to
# enforce reconciliation order. Prod never gets a tenants.yaml (Phase 9 is non-prod only).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
