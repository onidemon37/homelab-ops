apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shared-services
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: networking
  interval: 10m
  path: ./apps/overlays/prod/atlantis/shared-services
  prune: true
  wait: true
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
