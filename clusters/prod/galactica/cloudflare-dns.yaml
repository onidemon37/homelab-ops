apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-dns
  namespace: flux-system
spec:
  dependsOn:
    - name: secrets
    - name: networking
  interval: 10m
  path: ./apps/overlays/prod/galactica/cloudflare-dns
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
