# clusters/prod/observability-rules.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-rules
  namespace: flux-system
spec:
  dependsOn:
    - name: apps
  interval: 10m
  path: ./apps/overlays/prod/observability-rules
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
